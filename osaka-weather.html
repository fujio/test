<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大阪府天気予報</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .location-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .location-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .location-card h2 {
            color: #f5576c;
            margin-bottom: 15px;
            font-size: 1.5em;
            border-bottom: 2px solid #f5576c;
            padding-bottom: 10px;
        }

        .current-weather {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border-radius: 10px;
        }

        .current-temp {
            font-size: 3em;
            font-weight: bold;
            color: #f5576c;
        }

        .current-info {
            text-align: right;
        }

        .weather-icon {
            font-size: 2em;
            margin-right: 10px;
        }

        .hourly-forecast {
            overflow-x: auto;
        }

        .hourly-scroll {
            display: flex;
            gap: 10px;
            padding: 10px 0;
        }

        .hour-item {
            min-width: 80px;
            text-align: center;
            padding: 10px;
            background: #fff5f5;
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .hour-item:hover {
            background: #ffe0e0;
            border-color: #f5576c;
            transform: translateY(-5px);
        }

        .hour-time {
            font-weight: bold;
            color: #f5576c;
            margin-bottom: 5px;
        }

        .hour-temp {
            font-size: 1.2em;
            font-weight: bold;
            margin: 5px 0;
        }

        .hour-icon {
            font-size: 1.5em;
            margin: 5px 0;
        }

        .hour-precipitation {
            color: #4a90e2;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }

        .last-updated {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .reload-button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            background: white;
            color: #f5576c;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }

        .reload-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .reload-button:active {
            transform: translateY(-1px);
        }

        .wind-info {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 8px;
        }

        .wind-item {
            text-align: center;
        }

        .wind-label {
            font-size: 0.8em;
            color: #666;
        }

        .wind-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #f5576c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏙️ 大阪府天気予報</h1>
        <button class="reload-button" onclick="loadAllWeather()">🔄 更新</button>
        <div id="loading" class="loading">読み込み中...</div>
        <div id="weatherContainer" class="location-cards"></div>
        <div class="last-updated" id="lastUpdated"></div>
    </div>

    <script>
        // 各地域の座標
        const locations = [
            {
                name: '高槻市',
                lat: 34.8485,
                lon: 135.6169
            },
            {
                name: '吹田市',
                lat: 34.7614,
                lon: 135.5153
            }
        ];

        // 天気コードから絵文字を取得
        function getWeatherEmoji(weatherCode) {
            const weatherEmojis = {
                0: '☀️',   // Clear sky
                1: '🌤️',   // Mainly clear
                2: '⛅',   // Partly cloudy
                3: '☁️',   // Overcast
                45: '🌫️',  // Fog
                48: '🌫️',  // Depositing rime fog
                51: '🌦️',  // Light drizzle
                53: '🌦️',  // Moderate drizzle
                55: '🌧️',  // Dense drizzle
                61: '🌧️',  // Slight rain
                63: '🌧️',  // Moderate rain
                65: '🌧️',  // Heavy rain
                71: '🌨️',  // Slight snow
                73: '🌨️',  // Moderate snow
                75: '🌨️',  // Heavy snow
                77: '🌨️',  // Snow grains
                80: '🌦️',  // Slight rain showers
                81: '🌧️',  // Moderate rain showers
                82: '⛈️',  // Violent rain showers
                85: '🌨️',  // Slight snow showers
                86: '🌨️',  // Heavy snow showers
                95: '⛈️',  // Thunderstorm
                96: '⛈️',  // Thunderstorm with slight hail
                99: '⛈️'   // Thunderstorm with heavy hail
            };
            return weatherEmojis[weatherCode] || '🌡️';
        }

        // 天気コードから説明を取得
        function getWeatherDescription(weatherCode) {
            const descriptions = {
                0: '快晴',
                1: '晴れ',
                2: '一部曇り',
                3: '曇り',
                45: '霧',
                48: '霧',
                51: '小雨',
                53: '雨',
                55: '大雨',
                61: '小雨',
                63: '雨',
                65: '大雨',
                71: '小雪',
                73: '雪',
                75: '大雪',
                77: '雪',
                80: '小雨',
                81: '雨',
                82: '豪雨',
                85: '小雪',
                86: '大雪',
                95: '雷雨',
                96: '雹を伴う雷雨',
                99: '大雹を伴う雷雨'
            };
            return descriptions[weatherCode] || '不明';
        }

        // 天気データを取得
        async function fetchWeather(location) {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${location.lat}&longitude=${location.lon}&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&timezone=Asia/Tokyo&forecast_days=2`;

            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('天気データの取得に失敗しました');
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error fetching weather:', error);
                throw error;
            }
        }

        // 時刻をフォーマット
        function formatHour(dateString) {
            const date = new Date(dateString);
            return `${date.getHours()}時`;
        }

        // 天気カードを作成
        function createWeatherCard(location, weatherData) {
            const now = new Date();
            const currentHourIndex = weatherData.hourly.time.findIndex(time => {
                const timeDate = new Date(time);
                return timeDate >= now;
            });

            const currentTemp = weatherData.hourly.temperature_2m[currentHourIndex];
            const currentWeatherCode = weatherData.hourly.weather_code[currentHourIndex];
            const currentPrecip = weatherData.hourly.precipitation_probability[currentHourIndex];
            const currentWind = weatherData.hourly.wind_speed_10m[currentHourIndex];

            // 次の24時間分のデータを取得
            const hourlyData = [];
            for (let i = currentHourIndex; i < Math.min(currentHourIndex + 24, weatherData.hourly.time.length); i++) {
                hourlyData.push({
                    time: weatherData.hourly.time[i],
                    temp: weatherData.hourly.temperature_2m[i],
                    weatherCode: weatherData.hourly.weather_code[i],
                    precipitation: weatherData.hourly.precipitation_probability[i],
                    windSpeed: weatherData.hourly.wind_speed_10m[i]
                });
            }

            const card = document.createElement('div');
            card.className = 'location-card';

            let hourlyHTML = '';
            hourlyData.forEach(hour => {
                hourlyHTML += `
                    <div class="hour-item">
                        <div class="hour-time">${formatHour(hour.time)}</div>
                        <div class="hour-icon">${getWeatherEmoji(hour.weatherCode)}</div>
                        <div class="hour-temp">${Math.round(hour.temp)}°C</div>
                        <div class="hour-precipitation">💧${hour.precipitation}%</div>
                        <div style="color: #888; font-size: 0.85em;">🌬️${Math.round(hour.windSpeed)}m/s</div>
                    </div>
                `;
            });

            card.innerHTML = `
                <h2>${location.name}</h2>
                <div class="current-weather">
                    <div>
                        <div class="current-temp">${Math.round(currentTemp)}°C</div>
                        <div class="wind-info">
                            <div class="wind-item">
                                <div class="wind-label">降水確率</div>
                                <div class="wind-value">💧${currentPrecip}%</div>
                            </div>
                            <div class="wind-item">
                                <div class="wind-label">風速</div>
                                <div class="wind-value">🌬️${Math.round(currentWind)}m/s</div>
                            </div>
                        </div>
                    </div>
                    <div class="current-info">
                        <div class="weather-icon">${getWeatherEmoji(currentWeatherCode)}</div>
                        <div style="font-size: 1.2em; font-weight: bold;">${getWeatherDescription(currentWeatherCode)}</div>
                    </div>
                </div>
                <h3 style="color: #f5576c; margin-bottom: 10px;">時間ごとの予報</h3>
                <div class="hourly-forecast">
                    <div class="hourly-scroll">
                        ${hourlyHTML}
                    </div>
                </div>
            `;

            return card;
        }

        // すべての地域の天気を読み込み
        async function loadAllWeather() {
            const container = document.getElementById('weatherContainer');
            const loading = document.getElementById('loading');
            const lastUpdated = document.getElementById('lastUpdated');

            loading.style.display = 'block';
            container.innerHTML = '';

            try {
                for (const location of locations) {
                    const weatherData = await fetchWeather(location);
                    const card = createWeatherCard(location, weatherData);
                    container.appendChild(card);
                }

                const now = new Date();
                lastUpdated.textContent = `最終更新: ${now.toLocaleString('ja-JP')}`;
                loading.style.display = 'none';
            } catch (error) {
                loading.style.display = 'none';
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error';
                errorDiv.textContent = `エラー: ${error.message}`;
                container.appendChild(errorDiv);
            }
        }

        // ページ読み込み時に天気を取得
        window.addEventListener('load', loadAllWeather);
    </script>
</body>
</html>
